<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 340px; font-family: 'Segoe UI', system-ui, sans-serif;
         background: #070b09; color: #e6f5e9; padding: 16px; }
  h1 { font-size: 18px; color: #4ade80; letter-spacing: .5px; }
  h1 span { color: #e6f5e9; }
  .tag { font-size: 12px; color: #9fd8a8; margin: 4px 0 14px; }
  .card { background: #0e1510; border: 1px solid #1e3a24; border-radius: 12px;
          padding: 14px; }
  .cur { font-size: 12px; color: #9fd8a8; word-break: break-all; margin-bottom: 8px; }
  .verdict { font-size: 19px; font-weight: 800; }
  .high { color: #f87171; } .medium { color: #facc15; } .low { color: #4ade80; }
  .meter { height: 9px; background: #00000066; border-radius: 6px; margin: 10px 0 4px;
           overflow: hidden; }
  .meter i { display: block; height: 100%; }
  .pct { font-size: 12px; color: #c9e7cd; }
  ul { margin: 10px 0 0 16px; font-size: 12.5px; line-height: 1.6; }
  hr { border: 0; border-top: 1px solid #1e3a24; margin: 16px 0; }
  label { font-size: 12.5px; color: #9fd8a8; display: block; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; background: #070b09; border: 1px solid #2b4a32; color: #e6f5e9;
          border-radius: 8px; padding: 9px; font-size: 13px; outline: none; }
  button { background: #22c55e; color: #04140a; border: 0; font-weight: 700;
           padding: 9px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .foot { margin-top: 14px; font-size: 11px; color: #7d9b85; text-align: center; }
</style>
</head>
<body>
  <h1>🛡️ PHISH<span>GUARD</span></h1>
  <p class="tag">Ye page aur koi bhi link — turant check karo.</p>

  <div class="card">
    <div class="cur" id="cur">Is tab ka link check ho raha hai...</div>
    <div class="verdict" id="verdict"></div>
    <div class="meter"><i id="bar"></i></div>
    <div class="pct" id="pct"></div>
    <ul id="reasons"></ul>
  </div>

  <hr>
  <label for="manual">✍️ Koi aur link check karna hai? Yahan dalo:</label>
  <div class="row">
    <input id="manual" type="text" placeholder="https://shak-wala-link.com/login">
    <button id="go">Check</button>
  </div>
  <div class="card" id="manualCard" style="display:none; margin-top:12px;">
    <div class="verdict" id="mVerdict"></div>
    <div class="meter"><i id="mBar"></i></div>
    <div class="pct" id="mPct"></div>
    <ul id="mReasons"></ul>
  </div>

  <p class="foot">Sab check aapke browser ke andar hota hai — koi data bahar nahi jata.</p>

<script src="top_domains.js"></script>
<script src="model.js"></script>
<script src="features.js"></script>
<script src="engine.js"></script>
<script src="popup.js"></script>
</body>
</html>
